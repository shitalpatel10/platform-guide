<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Station - Platform Guide</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script/tailwind-config.js"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-100 z-50 h-16 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full grid grid-cols-3 items-center">
            
            <!-- Left Column: Navigation Hub -->
            <div id="nav-left" class="flex items-center justify-start">
                <!-- Navigation Hub will be injected here by main.js -->
            </div>

            <!-- Center Column: Station Identity -->
            <div class="flex flex-col items-center justify-center text-center">
                <div class="flex items-center space-x-2 h-7">
                    <i class="fa-solid fa-train-subway text-primary text-[10px] opacity-40"></i>
                    <h1 id="header-station-name" class="font-extrabold text-base tracking-tight text-gray-900 uppercase">
                        New Station
                    </h1>
                </div>
                <div id="header-station-code" class="text-[9px] font-black font-mono text-gray-400 mt-0.5 tracking-[0.2em] bg-gray-50 px-2 py-0.5 rounded border border-gray-100 uppercase leading-none">
                    ---
                </div>
            </div>

            <!-- Right Column: Contextual Actions -->
            <div id="nav-right" class="flex items-center justify-end space-x-3">
                <div class="relative hidden sm:flex items-center bg-gray-50 rounded-xl px-3 py-2 border border-gray-100 focus-within:border-primary/30 focus-within:bg-white focus-within:ring-4 focus-within:ring-primary/5 transition-all w-48">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-xs mr-2"></i>
                    <input type="text" id="location-search" class="bg-transparent border-none outline-none text-xs text-gray-900 placeholder-gray-400 w-full font-medium" placeholder="Jump to location..." onkeydown="handleSearch(event)">
                </div>
                <button onclick="recenterMap()" class="p-2.5 bg-white hover:bg-gray-50 text-gray-500 border border-gray-200 rounded-xl transition-all shadow-sm group" title="Recenter View">
                    <i class="fa-solid fa-crosshairs group-hover:text-primary"></i>
                </button>
            </div>

        </div>
    </nav>

    <!-- Layout Wrapper Container -->
    <div class="flex-grow flex flex-row relative h-full w-full overflow-hidden animate-fade-in">
        
        <!-- Map Container -->
        <div class="flex-grow relative">
            <div id="map" class="absolute inset-0 bg-slate-50"></div>

            <!-- Location details hidden display for logic compatibility -->
            <div class="hidden">
                 <span id="lat-display"></span>
                 <span id="lng-display"></span>
            </div>
        </div>

        <!-- Sidebar Container -->
        <div id="sidebar-container"
            class="w-80 bg-white border-l border-gray-200 shadow-sm flex-shrink-0 flex flex-col z-[1500] transition-all overflow-hidden">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
                <h2 id="sidebar-title" class="font-bold text-gray-900 flex items-center text-sm">
                    <i class="fa-solid fa-city text-primary mr-2"></i> Station Workspace
                </h2>
            </div>
            
            <div id="sidebar-content" class="flex-grow overflow-y-auto p-4 space-y-3 bg-white">
                <div class="py-12 text-center text-gray-400">
                    <i class="fa-solid fa-draw-polygon text-3xl mb-3 opacity-20"></i>
                    <p class="text-xs">Start drawing to configure station details.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Location Selection Overlay -->
    <div id="location-selection-overlay"
        class="fixed inset-0 bg-gray-50 z-[2000] hidden flex flex-col items-center justify-center p-4">
        <div class="max-w-md w-full text-center space-y-8">
            <div>
                <div class="mx-auto w-16 h-16 bg-blue-100 text-primary rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-map-location-dot text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900">Where is the station?</h2>
                <p class="text-gray-500 mt-2">Search for a location or choose from popular cities to get started.</p>
            </div>

            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="wizard-search-input"
                    class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none shadow-sm transition-all"
                    placeholder="Search city or area..." onkeydown="if(event.key==='Enter') searchLocationWizard()">
                <button onclick="searchLocationWizard()"
                    class="absolute right-2 top-2 p-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600 transition-colors">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="selectPredefinedLocation('Amravati')"
                    class="p-3 bg-white border border-gray-200 rounded-xl hover:border-primary hover:bg-blue-50 hover:text-primary transition-all font-medium text-gray-700 shadow-sm text-left flex items-center">
                    <i class="fa-solid fa-location-dot mr-2 text-red-500"></i> Amravati
                </button>
                <button onclick="selectPredefinedLocation('Badnera')"
                    class="p-3 bg-white border border-gray-200 rounded-xl hover:border-primary hover:bg-blue-50 hover:text-primary transition-all font-medium text-gray-700 shadow-sm text-left flex items-center">
                    <i class="fa-solid fa-location-dot mr-2 text-red-500"></i> Badnera
                </button>
                <button onclick="selectPredefinedLocation('Dhamangaon')"
                    class="p-3 bg-white border border-gray-200 rounded-xl hover:border-primary hover:bg-blue-50 hover:text-primary transition-all font-medium text-gray-700 shadow-sm text-left flex items-center">
                    <i class="fa-solid fa-location-dot mr-2 text-red-500"></i> Dhamangaon
                </button>
                <button onclick="selectPredefinedLocation('Nagpur')"
                    class="p-3 bg-white border border-gray-200 rounded-xl hover:border-primary hover:bg-blue-50 hover:text-primary transition-all font-medium text-gray-700 shadow-sm text-left flex items-center">
                    <i class="fa-solid fa-location-dot mr-2 text-red-500"></i> Nagpur
                </button>
            </div>

            <button onclick="useCurrentLocation()" class="text-sm text-primary hover:underline font-medium">
                <i class="fa-solid fa-crosshairs mr-1"></i> Use my current location
            </button>
        </div>
    </div>

    <!-- Custom Drawing Controls -->
    <div id="drawing-controls"
        class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-white px-4 py-3 rounded-2xl shadow-xl z-[1000] flex items-center space-x-4 border border-gray-100 transition-all duration-300">

        <button id="btn-add-polygon" onclick="addPolygon()"
            class="hidden flex flex-col items-center justify-center space-y-1 w-16 group">
            <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors text-primary">
                <i class="fa-solid fa-draw-polygon"></i>
            </div>
            <span class="text-[10px] font-semibold text-gray-600 uppercase tracking-wide">Add Poly</span>
        </button>

        <button id="btn-delete-vertex" onclick="deleteSelectedVertex()" disabled
            class="flex flex-col items-center justify-center space-y-1 w-16 group transition-all duration-300 opacity-50 cursor-not-allowed"
            title="Double Click a Vertex to Delete">
            <div class="w-10 h-10 bg-red-50 rounded-full flex items-center justify-center text-red-500 ring-2 ring-red-500 ring-offset-2 group-disabled:ring-gray-300 group-disabled:bg-gray-100 group-disabled:text-gray-400 transition-colors">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <span class="text-[10px] font-semibold text-gray-600 uppercase tracking-wide">Del Vertex</span>
        </button>

        <div class="w-px h-8 bg-gray-200"></div>

        <div id="zoom-controls-container" class="flex flex-col space-y-1">
            <button onclick="map.zoomIn()"
                class="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full text-gray-700 transition-colors">
                <i class="fa-solid fa-plus text-xs"></i>
            </button>
            <button onclick="map.zoomOut()"
                class="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full text-gray-700 transition-colors">
                <i class="fa-solid fa-minus text-xs"></i>
            </button>
        </div>

        <div class="w-px h-8 bg-gray-200"></div>

        <button onclick="openStationDetailsModal()"
            class="flex flex-col items-center justify-center space-y-1 w-16 group">
            <div class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center text-green-600 ring-2 ring-green-600 ring-offset-2 hover:bg-green-100 transition-colors">
                <i class="fa-solid fa-check"></i>
            </div>
            <span class="text-[10px] font-semibold text-gray-600 uppercase tracking-wide">Save</span>
        </button>
    </div>

    <!-- Hidden inputs for geometry -->
    <input type="hidden" id="new-station-lat">
    <input type="hidden" id="new-station-lng">
    <input type="hidden" id="new-station-zoom">

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <!-- Modularized Scripts -->
    <script src="script/main.js"></script>
    <script src="script/editor-engine.js"></script>
    <script src="script/station.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const stationId = urlParams.get('id');
            const isNew = urlParams.get('new') === 'true';

            if (stationId || isNew) {
                initManageStation(stationId);
            } else {
                alert("No station ID provided!");
                window.location.href = 'index.html';
            }
        });

        function recenterMap() {
            if (!map) return;
            const station = Storage.getStationById(currentStationId);
            if (station && station.geojson) {
                const layer = L.geoJSON(station.geojson);
                map.fitBounds(layer.getBounds(), { padding: [100, 100], duration: 1.5 });
            } else if (station) {
                map.flyTo([station.lat, station.lng], station.zoom || 15, { duration: 1.5 });
            }
        }
    </script>
</body>
</html>
