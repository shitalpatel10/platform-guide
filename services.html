<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - Platform Guide</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script/tailwind-config.js"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <!-- Navbar HEADER -->
    <nav class="bg-white shadow-sm border-b border-gray-100 z-50 h-16 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex justify-between items-center">
            <div class="flex items-center">
                <a href="index.html" class="flex items-center text-gray-500 hover:text-gray-900 transition-colors mr-4">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                
                <div class="flex flex-col items-start cursor-default text-left ml-2">
                    <h1 id="header-station-name" class="font-bold text-lg leading-none text-gray-900 flex items-center">
                        Loading Station...
                    </h1>
                    <span id="header-station-code" class="text-[10px] font-mono text-gray-500 mt-0.5 bg-gray-100 px-1.5 rounded">---</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="recenterMap()"
                    class="inline-flex items-center px-4 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 text-sm font-medium rounded-lg transition-colors shadow-sm">
                    <i class="fa-solid fa-crosshairs mr-2 text-gray-500"></i> Recenter
                </button>
                <a href="#" id="manage-platforms-link"
                    class="inline-flex items-center px-4 py-2 bg-primary hover:bg-secondary text-white border border-transparent text-sm font-medium rounded-lg transition-colors shadow-sm shadow-blue-500/20">
                    <i class="fa-solid fa-layer-group mr-2"></i> Manage Platforms
                </a>
            </div>
        </div>
    </nav>

    <!-- Layout Wrapper Container -->
    <div class="flex-grow flex flex-row relative h-full w-full overflow-hidden">
        
        <!-- MAP Container -->
        <div class="flex-grow relative h-full">
            <div id="map" class="absolute inset-0 bg-slate-50 z-10"></div>
        </div>

        <!-- Sidebar Container -->
        <div id="sidebar-container" class="w-72 bg-white border-l border-gray-200 shadow-sm flex-shrink-0 flex flex-col z-[1500] transition-all overflow-hidden">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
                <h2 id="sidebar-title" class="font-bold text-gray-900 flex items-center text-sm">
                    <i class="fa-solid fa-list-ul text-purple-600 mr-2"></i> Platforms / Services
                </h2>
            </div>
            <div id="sidebar-content" class="flex-grow overflow-y-auto p-4 space-y-3 bg-white">
                <!-- Content will be injected -->
            </div>
        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Modularized Scripts -->
    <script src="script/main.js"></script>
    <script src="script/services.js"></script>
</body>
</html>
