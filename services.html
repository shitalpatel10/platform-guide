<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - Platform Guide</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->

        tailwind.config = {

                        secondary: '#1E40AF',

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom Styles -->

            width: 100%;
            height: 100%;

        }

</head>

<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <!-- Navbar HEADER -->
    <nav class="bg-white shadow-sm border-b border-gray-100 z-50 h-16 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex justify-between items-center">
            <div class="flex items-center">
                <!-- Back Button -->
                <a href="index.html" class="flex items-center text-gray-500 hover:text-gray-900 transition-colors mr-4">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                
                <!-- Station Name and Code -->
                <div class="flex flex-col items-start cursor-default text-left ml-2">
                    <h1 id="header-station-name"
                        class="font-bold text-lg leading-none text-gray-900 flex items-center">
                        Loading Station...
                    </h1>
                    <span id="header-station-code"
                        class="text-[10px] font-mono text-gray-500 mt-0.5 bg-gray-100 px-1.5 rounded">---</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <a href="#" id="manage-platforms-link"
                    class="inline-flex items-center px-4 py-2 bg-primary hover:bg-secondary text-white border border-transparent text-sm font-medium rounded-lg transition-colors shadow-sm shadow-blue-500/20">
                    <i class="fa-solid fa-layer-group mr-2"></i> Manage Platforms
                </a>
            </div>
        </div>
    </nav>

    <!-- Layout Wrapper Container -->
    <div class="flex-grow flex flex-row relative h-full w-full overflow-hidden">
        
        <!-- MAP Container -->
        <div class="flex-grow relative h-full">
            <div id="map" class="absolute inset-0 bg-slate-50 z-10"></div>
        </div> <!-- End Map Container -->

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="w-72 bg-white border-l border-gray-200 shadow-sm flex-shrink-0 flex flex-col z-[1500] transition-all overflow-hidden border-t-0">
        <div class="p-4 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
            <h2 id="sidebar-title" class="font-bold text-gray-900 flex items-center text-sm">
                <i class="fa-solid fa-list-ul text-purple-600 mr-2"></i> Platforms / Services
            </h2>
        </div>
        <div id="sidebar-content" class="flex-grow overflow-y-auto p-4 space-y-3 bg-white">
            <!-- Dynamically injected sidebar content -->
        </div>
    </div>

    </div> <!-- End Layout Wrapper Container -->


    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Load main script for Data Management (Storage object) -->
    <script src="script/main.js"></script>

    <!-- Platform specific logic script -->
    <script>
        // --- Global State ---
        let currentStationId = null;
        let platformsData = []; // To keep track of all platforms for this station
        let selectedPlatformId = null; // The ID of the currently selected/editable platform
        let editedPlatformLayer = null; // The leaflet layer of the currently selected platform
        let platformsFeatureGroup = null; // Group holding all static platforms
        
        let pServiceMarkers = [];
        let currentServicesData = [];
        let currentPlacementServiceType = null;

        let osmServicesGroup = null;
        let fetchedOSMElements = [];

        function isPointInPolygon(point, vs) {
            let x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i].lat, yi = vs[i].lng;
                let xj = vs[j].lat, yj = vs[j].lng;
                
                let intersect = ((yi > y) != (yj > y))
                    && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        const PLATFORM_SERVICES = {
            'washroom': { name: 'Washroom', icon: 'fa-restroom', color: 'text-blue-500', bg: 'bg-blue-100' },
            'water_cooler': { name: 'Water Cooler', icon: 'fa-glass-water', color: 'text-cyan-500', bg: 'bg-cyan-100' },
            'grocery': { name: 'Grocery / Shop', icon: 'fa-store', color: 'text-green-500', bg: 'bg-green-100' },
            'tea_coffee': { name: 'Tea / Coffee Stall', icon: 'fa-mug-hot', color: 'text-orange-500', bg: 'bg-orange-100' },
            'waiting_area': { name: 'Waiting Area', icon: 'fa-chair', color: 'text-indigo-500', bg: 'bg-indigo-100' },
            'charging_point': { name: 'Charging Point', icon: 'fa-plug', color: 'text-yellow-500', bg: 'bg-yellow-100' },
            'ticket': { name: 'Ticket Counter', icon: 'fa-ticket', color: 'text-pink-500', bg: 'bg-pink-100' },
            'info': { name: 'Information Desk', icon: 'fa-circle-info', color: 'text-sky-500', bg: 'bg-sky-100' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentStationId = urlParams.get('id');

            if (!currentStationId) {
                alert("No station ID provided!");
                window.location.href = 'index.html';
                return;
            }

            // Retrieve station data
            const station = Storage.getStationById(currentStationId);
            if (!station) {
                alert("Station not found!");
                window.location.href = 'index.html';
                return;
            }

            // Keyboard shortcuts 
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (editedPlatformLayer || selectedPlatformId) {
                        clearPlatformEditingState();
                    }
                }
            });

            // Update Header Name and Code
            document.getElementById('header-station-name').innerText = station.name;
            document.getElementById('header-station-code').innerText = station.code;
            
            const managePlatformsLink = document.getElementById('manage-platforms-link');
            if (managePlatformsLink) {
                managePlatformsLink.href = 'platform.html?id=' + currentStationId;
            }

            // Initialize Map
            // Hide zoom controls natively, we can add custom later if needed
            map = L.map('map', { zoomControl: false, maxZoom: 24 }).setView([station.lat, station.lng], station.zoom || 14);

            // Add standard Base Layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 24,
                maxNativeZoom: 19,
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            // Add OpenRailwayMap Overlay layer
            L.tileLayer('https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
                maxZoom: 24,
                maxNativeZoom: 19,
                attribution: 'Map data: &copy; OpenStreetMap | Map style: &copy; OpenRailwayMap'
            }).addTo(map);

            // Render existing station area as a disabled/non-editable feature
            if (station.geojson) {
                const stationFeatureGroup = new L.FeatureGroup();
                map.addLayer(stationFeatureGroup);
                
                // Parse GEOJSON
                const geoJsonLayer = L.geoJSON(station.geojson);
                
                // Add layers from parsed GeoJSON and style them
                geoJsonLayer.eachLayer(layer => {
                    layer.setStyle({ 
                        color: '#2563EB', // Primary blue
                        fillOpacity: 0.1, // Lighter opacity to reflect that it's uneditable
                        weight: 2,
                        dashArray: '5, 5' // Make border dashed to show it's a boundary context, not an active drawing
                    });
                    
                    // Add purely visual layer, disable interactivity if needed
                    layer.options.interactive = false; 
                    
                    stationFeatureGroup.addLayer(layer);
                });
                
                // Fit bounds to station if no platforms
                map.fitBounds(stationFeatureGroup.getBounds());
            }

            // Render existing platforms permanently stored in Storage
            platformsData = Storage.getPlatformsByStationId(currentStationId);
            platformsFeatureGroup = new L.FeatureGroup();
            map.addLayer(platformsFeatureGroup);

            if (platformsData && platformsData.length > 0) {
                renderAllStaticPlatforms();
                
                // If platforms exist, fit bounds to them instead of just the station
                map.fitBounds(platformsFeatureGroup.getBounds());
            }

            renderSidebar();

            // Fetch OSM Services Data
            setTimeout(() => {
                fetchOSMServices();
            }, 600);

            // Clicking on map (not on a marker/platform) should deselect
            map.on('click', (e) => {
                if (currentPlacementServiceType) {
                    currentServicesData.push({
                        type: currentPlacementServiceType,
                        lat: e.latlng.lat,
                        lng: e.latlng.lng
                    });
                    currentPlacementServiceType = null;
                    renderServiceMarkers();
                    renderSidebar(); // to hide hint
                    return;
                }
            });
        });

        function renderAllStaticPlatforms() {
            platformsFeatureGroup.clearLayers();
            
            platformsData.forEach(p => {
                if (p.id === selectedPlatformId) return; // Don't render static if it's currently selected

                if (p.geojson) {
                    const layer = L.geoJSON(p.geojson, {
                        style: {
                            color: '#6B7280', // Gray-500 for unselected
                            weight: 2,
                            fillOpacity: 0.4
                        }
                    }).bindTooltip(p.name, {
                        permanent: true, 
                        direction: 'center',
                        className: 'font-bold text-gray-700 bg-white/80 border-none shadow-sm rounded px-1 py-0.5 text-xs'
                    });

                    // Add click event to select this platform
                    layer.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        selectPlatform(p.id);
                    });

                    // Add hover effects
                    layer.on('mouseover', function (e) {
                        this.setStyle({
                            fillOpacity: 0.6,
                            color: '#8B5CF6' // Purple-500
                        });
                        this.bringToFront();
                    });
                    
                    layer.on('mouseout', function (e) {
                        this.setStyle({
                            fillOpacity: 0.4,
                            color: '#6B7280' // Gray-500
                        });
                    });

                    platformsFeatureGroup.addLayer(layer);
                }

                // ALSO render static services for this platform
                if (p.services && p.services.length > 0) {
                    p.services.forEach(srv => {
                        const sType = PLATFORM_SERVICES[srv.type];
                        if (sType) {
                            const sm = L.marker([srv.lat, srv.lng], {
                                interactive: false,
                                icon: L.divIcon({
                                    className: 'static-service-marker',
                                    html: `<div class="w-5 h-5 ${sType.bg} ${sType.color} rounded-full border border-white shadow-sm flex items-center justify-center text-[10px] opacity-80"><i class="fa-solid ${sType.icon}"></i></div>`,
                                    iconSize: [20, 20],
                                    iconAnchor: [10, 10]
                                })
                            });
                            platformsFeatureGroup.addLayer(sm);
                        }
                    });
                }
            });
        }

        function renderSidebar() {
            const sidebarTitle = document.getElementById('sidebar-title');
            const sidebarContent = document.getElementById('sidebar-content');

            if (selectedPlatformId || editedPlatformLayer) {
                sidebarTitle.innerHTML = `<i class="fa-solid fa-layer-group text-purple-600 mr-2"></i> Services`;
                
                const platform = platformsData.find(p => p.id === selectedPlatformId);
                const name = platform ? platform.name : "Platform Services";

                let currentServicesHTML = currentServicesData.length === 0 ? '<p class="text-xs text-gray-500">No services added yet.</p>' : currentServicesData.map((srv, idx) => {
                    const sType = PLATFORM_SERVICES[srv.type];
                    return `<div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded-lg shadow-sm">
                        <div class="flex items-center space-x-2">
                            <div class="w-6 h-6 ${sType.bg} ${sType.color} rounded-full flex justify-center items-center text-[10px]"><i class="fa-solid ${sType.icon}"></i></div>
                            <span class="text-xs font-semibold text-gray-700">${sType.name}</span>
                        </div>
                        <button onclick="deleteService(${idx})" class="text-red-400 hover:text-red-600 p-1 transition-colors"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>`;
                }).join('');

                sidebarContent.innerHTML = `
                    <div class="bg-purple-50 rounded-xl p-4 border border-purple-100">
                        <div class="text-xs font-semibold text-purple-400 uppercase tracking-wider mb-1">Editing Platform</div>
                        <h3 class="text-lg font-bold text-purple-900 truncate">${name}</h3>
                    </div>

                    <div class="mt-4 space-y-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Add Services</p>
                        ${currentPlacementServiceType ? `
                            <div class="bg-blue-50 border border-blue-200 text-blue-700 text-xs p-2 rounded flex items-center justify-between shadow-sm">
                                <span>Click on map to place <b>${PLATFORM_SERVICES[currentPlacementServiceType].name}</b></span>
                                <button onclick="currentPlacementServiceType=null; renderSidebar()" class="text-blue-500 hover:text-blue-800"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        ` : `
                        <div class="grid grid-cols-4 gap-2">
                            ${Object.keys(PLATFORM_SERVICES).map(key => `
                                <button onclick="startPlacingService('${key}')" title="${PLATFORM_SERVICES[key].name}" class="h-10 border border-gray-200 bg-white rounded-lg flex items-center justify-center hover:bg-purple-50 hover:text-purple-600 hover:border-purple-300 transition-colors shadow-sm text-gray-500">
                                    <i class="fa-solid ${PLATFORM_SERVICES[key].icon}"></i>
                                </button>
                            `).join('')}
                        </div>
                        `}
                    </div>

                    <div class="mt-4 space-y-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Current Services</p>
                        ${currentServicesHTML}
                    </div>

                    <div class="mt-4 space-y-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Quick Actions</p>
                        <button onclick="saveServices()" class="w-full text-left px-3 py-2 bg-white hover:bg-green-50 hover:text-green-700 hover:border-green-200 text-green-600 font-medium text-sm rounded-lg transition-colors border border-gray-200 shadow-sm">
                            <i class="fa-solid fa-check mr-2"></i> Save Services
                        </button>
                        <button onclick="clearPlatformEditingState()" class="w-full text-left px-3 py-2 bg-white hover:bg-gray-100 text-gray-600 hover:text-gray-900 border border-gray-200 font-medium text-sm rounded-lg transition-colors shadow-sm">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Platforms
                        </button>
                    </div>
                `;
            } else {
                // List View
                sidebarTitle.innerHTML = `<i class="fa-solid fa-list-ul text-purple-600 mr-2"></i> All Platforms`;
                
                if (platformsData.length === 0) {
                    sidebarContent.innerHTML = `
                        <div class="text-center py-10 px-4">
                            <div class="w-12 h-12 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-3">
                                <i class="fa-solid fa-layer-group text-xl"></i>
                            </div>
                            <p class="text-sm text-gray-500 font-medium">No platforms found</p>
                            <p class="text-xs text-gray-400 mt-1">Please create a platform first in Manage Platforms.</p>
                        </div>
                    `;
                } else {
                    let html = '';
                    platformsData.forEach(p => {
                        html += `
                            <div onclick="selectPlatform('${p.id}')" class="group bg-white border border-gray-200 hover:border-purple-300 rounded-xl p-3 cursor-pointer transition-all shadow-sm hover:shadow-md flex items-center justify-between">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <div class="w-8 h-8 rounded bg-purple-50 flex items-center justify-center text-purple-600 group-hover:scale-110 group-hover:bg-purple-100 transition-all flex-shrink-0">
                                        <i class="fa-solid fa-train"></i>
                                    </div>
                                    <div class="truncate">
                                        <p class="font-bold text-sm text-gray-800 group-hover:text-purple-700 transition-colors truncate">${p.name}</p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-chevron-right text-gray-300 group-hover:text-purple-400 text-xs transition-colors"></i>
                            </div>
                        `;
                    });
                    sidebarContent.innerHTML = html;
                }
            }
        }

        // --- Platform Drawing / Selection Logic ---
        function selectPlatform(platformId) {
            // If we are already editing one, maybe ask to save/discard first?
            if (editedPlatformLayer) {
                if(!confirm("You have unsaved changes on the current platform. Discard and select another?")) {
                    return;
                }
                clearPlatformEditingState();
            }

            selectedPlatformId = platformId;
            const platform = platformsData.find(p => p.id === platformId);
            if (!platform) return;

            // Remove it from static group and re-render static
            renderAllStaticPlatforms();

            // Create editable polygon from saved geojson
            // extracting the polygon data
            const staticLayer = L.geoJSON(platform.geojson);
            const latlngs = staticLayer.getLayers()[0].getLatLngs();

            // Load saved services
            currentServicesData = platform.services ? JSON.parse(JSON.stringify(platform.services)) : [];

            startEditingPlatformPolygon(latlngs);
        }

        function clearPlatformEditingState() {
            if (editedPlatformLayer) {
                map.removeLayer(editedPlatformLayer);
                editedPlatformLayer = null;
            }
            clearServiceMarkers();
            currentServicesData = [];
            currentPlacementServiceType = null;
            selectedPlatformId = null;
            renderAllStaticPlatforms();
            renderSidebar();
            renderOSMServices();
        }

        function startEditingPlatformPolygon(latlngs) {
            editedPlatformLayer = L.polygon(latlngs, {
                color: 'purple',
                weight: 3,
                fillOpacity: 0.1,
                interactive: false // Don't let users interact with it
            }).addTo(map);

            renderServiceMarkers();
            renderSidebar();
            renderOSMServices();
        }

        // --- Services Control Logic ---
        
        async function fetchOSMServices() {
            const bounds = map.getBounds();
            const s = bounds.getSouth() - 0.002;
            const w = bounds.getWest() - 0.002;
            const n = bounds.getNorth() + 0.002;
            const e = bounds.getEast() + 0.002;
            
            const query = `
                [out:json];
                (
                  node["amenity"="toilets"](${s},${w},${n},${e});
                  node["amenity"="drinking_water"](${s},${w},${n},${e});
                  node["shop"="convenience"](${s},${w},${n},${e});
                  node["amenity"="charging_station"](${s},${w},${n},${e});
                );
                out body;
            `;
            
            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                fetchedOSMElements = data.elements || [];
                renderOSMServices();
            } catch(err) {
                console.error("Failed to fetch OSM services", err);
            }
        }

        function renderOSMServices() {
            if (osmServicesGroup) {
                map.removeLayer(osmServicesGroup);
            }
            osmServicesGroup = new L.FeatureGroup();
            map.addLayer(osmServicesGroup);

            fetchedOSMElements.forEach(el => {
                const pt = [el.lat, el.lon];
                let isInside = false;

                if (editedPlatformLayer) {
                    const latlngs = editedPlatformLayer.getLatLngs()[0];
                    isInside = isPointInPolygon(pt, latlngs);
                } else if (platformsData) {
                    for (let p of platformsData) {
                         if (p.geojson) {
                            const coords = p.geojson.geometry.coordinates[0]; // [ [lng, lat], ... ]
                            const polyLatLngs = coords.map(c => ({lat: c[1], lng: c[0]}));
                            if (isPointInPolygon(pt, polyLatLngs)) {
                                isInside = true;
                                break;
                            }
                         }
                    }
                }

                if (isInside) {
                    let iconChar = 'ℹ️';
                    let name = 'Service';
                    
                    if (el.tags['amenity'] === 'toilets') { iconChar = '🚻'; name = 'Washroom / Toilet'; }
                    else if (el.tags['amenity'] === 'drinking_water') { iconChar = '💧'; name = 'Water Cooler / Drinking Water'; }
                    else if (el.tags['shop'] === 'convenience') { iconChar = '🛒'; name = 'Grocery Shop / Convenience Shop'; }
                    else if (el.tags['amenity'] === 'charging_station') { iconChar = '🔌'; name = 'Charging Point'; }

                    const marker = L.marker([el.lat, el.lon], {
                        interactive: true,
                        icon: L.divIcon({
                            className: 'osm-service-marker',
                            html: '<div class="w-6 h-6 bg-white rounded-full border border-blue-400 shadow-md flex items-center justify-center text-[12px] leading-none hover:scale-110 transition-transform cursor-pointer">' + iconChar + '</div>',
                            iconSize: [24, 24],
                            iconAnchor: [12, 12]
                        })
                    }).bindPopup('<b>' + name + '</b>');
                    
                    osmServicesGroup.addLayer(marker);
                }
            });
        }

        function startPlacingService(type) {
            currentPlacementServiceType = type;
            renderSidebar(); // update UI overlay
        }

        function clearServiceMarkers() {
            pServiceMarkers.forEach(m => map.removeLayer(m));
            pServiceMarkers = [];
        }

        function renderServiceMarkers() {
            clearServiceMarkers();
            
            if (!editedPlatformLayer) return;

            currentServicesData.forEach((srv, index) => {
                const sType = PLATFORM_SERVICES[srv.type];
                if(!sType) return;
                
                const marker = L.marker([srv.lat, srv.lng], {
                    draggable: true,
                    icon: L.divIcon({
                        className: 'service-marker',
                        html: `<div class="w-7 h-7 ${sType.bg} ${sType.color} rounded-full border-2 border-white shadow-md flex items-center justify-center text-[12px] group relative" title="${sType.name} (Dbl-Click to delete)">
                            <i class="fa-solid ${sType.icon}"></i>
                            <div class="absolute -top-2 -right-2 w-4 h-4 bg-red-500 text-white rounded-full flex flex-col items-center justify-center text-[8px] opacity-0 group-hover:opacity-100 cursor-pointer shadow">
                                <i class="fa-solid fa-xmark"></i>
                            </div>
                            </div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    })
                }).addTo(map);

                marker.on('dragend', (e) => {
                    const pos = e.target.getLatLng();
                    srv.lat = pos.lat;
                    srv.lng = pos.lng;
                });

                marker.on('dblclick', (e) => {
                     L.DomEvent.stopPropagation(e);
                     currentServicesData.splice(index, 1);
                     renderServiceMarkers();
                });

                pServiceMarkers.push(marker);
            });
        }

        function deleteService(index) {
            if(index >= 0 && index < currentServicesData.length) {
                currentServicesData.splice(index, 1);
                renderServiceMarkers();
                renderSidebar();
            }
        }

        function saveServices() {
            if (!selectedPlatformId) return;
            const index = platformsData.findIndex(p => p.id === selectedPlatformId);
            if(index !== -1) {
                platformsData[index].services = currentServicesData;
                Storage.savePlatforms(platformsData);
                showToast("Services saved successfully!");
                clearPlatformEditingState();
            }
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-5 right-5 ${isError ? 'bg-red-600' : 'bg-green-600'} text-white px-6 py-3 rounded-lg shadow-lg z-[4000] flex items-center transition-all duration-300 transform translate-y-10 opacity-0 font-medium text-sm`;
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation' : 'fa-check'} mr-2"></i> ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 50);
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
