<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Platforms - Platform Guide</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563EB',
                        secondary: '#1E40AF',
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css"> <!-- Re-use global styles if any -->

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Ensures map takes remaining height properly */
        #map {
            width: 100%;
            height: 100%;
            z-index: 10;
        }
    </style>
</head>

<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <!-- Navbar HEADER -->
    <nav class="bg-white shadow-sm border-b border-gray-100 z-50 h-16 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex justify-between items-center">
            <div class="flex items-center">
                <!-- Back Button -->
                <a href="index.html" class="flex items-center text-gray-500 hover:text-gray-900 transition-colors mr-4">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                
                <!-- Station Name and Code -->
                <div class="flex flex-col items-start cursor-default text-left ml-2">
                    <h1 id="header-station-name"
                        class="font-bold text-lg leading-none text-gray-900 flex items-center">
                        Loading Station...
                    </h1>
                    <span id="header-station-code"
                        class="text-[10px] font-mono text-gray-500 mt-0.5 bg-gray-100 px-1.5 rounded">---</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <a href="#" id="manage-services-link"
                    class="inline-flex items-center px-4 py-2 bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 text-sm font-medium rounded-lg transition-colors shadow-sm">
                    <i class="fa-solid fa-location-dot mr-2 text-indigo-500"></i> Manage Services
                </a>
            </div>
        </div>
    </nav>

    <!-- Layout Wrapper Container -->
    <div class="flex-grow flex flex-row relative h-full w-full overflow-hidden">
        
        <!-- MAP Container -->
        <div class="flex-grow relative h-full">
            <div id="map" class="absolute inset-0 bg-slate-50"></div>

        <!-- Platform Details Card (Modal) -->
        <div id="platform-details-card-backdrop" onclick="togglePlatformDetailsModal()"
            class="fixed inset-0 bg-gray-900/20 backdrop-blur-sm z-[2500] hidden transition-opacity"></div>

        <div id="platform-details-card"
            class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-2xl shadow-2xl border border-gray-100 w-full max-w-sm z-[3000] hidden transition-all duration-300 scale-95 opacity-0">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-gray-900 flex items-center">
                    <i class="fa-solid fa-vector-square text-purple-600 mr-2"></i> Platform Details
                </h2>
                <button onclick="togglePlatformDetailsModal()"
                    class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Platform Name/Number</label>
                    <input type="text" id="platform-name-input" placeholder="e.g., Platform 1"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all outline-none text-sm text-gray-900 font-medium shadow-sm">
                </div>

                <div class="space-y-3 pt-4">
                    <button onclick="confirmSavePlatform()"
                        class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-lg shadow-purple-600/30 transition-all transform active:scale-95">
                        Save Platform
                    </button>
                    <button onclick="togglePlatformDetailsModal(false)"
                        class="w-full py-2 bg-white hover:bg-gray-100 text-gray-600 border border-gray-200 font-semibold rounded-xl transition-colors">
                        Close
                    </button>
                </div>
            </div>
        </div>

        <!-- Custom Drawing Controls (Bottom Center) -->
        <div id="drawing-controls"
            class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-white px-4 py-3 rounded-2xl shadow-xl z-[1000] flex items-center space-x-4 border border-gray-100 transition-all duration-300">

            <button id="btn-add-polygon" onclick="addPlatformPolygon()"
                class="flex flex-col items-center justify-center space-y-1 w-16 group">
                <div
                    class="w-10 h-10 bg-purple-50 rounded-full flex items-center justify-center group-hover:bg-purple-500 group-hover:text-white transition-colors text-purple-600">
                    <i class="fa-solid fa-draw-polygon"></i>
                </div>
                <span class="text-[10px] font-semibold text-gray-600 uppercase tracking-wide">Add Poly</span>
            </button>

            <button id="btn-delete-vertex" onclick="deletePlatformSelectedVertex()" disabled
                class="flex flex-col items-center justify-center space-y-1 w-16 group transition-all duration-300 opacity-50 cursor-not-allowed"
                title="Double Click a Vertex to Delete">
                <div
                    class="w-10 h-10 bg-red-50 rounded-full flex items-center justify-center text-red-500 ring-2 ring-red-500 ring-offset-2 group-disabled:ring-gray-300 group-disabled:bg-gray-100 group-disabled:text-gray-400 group-focus:ring-red-500 transition-colors">
                    <i class="fa-solid fa-trash-can"></i>
                </div>
                <span class="text-[10px] font-semibold text-gray-600 uppercase tracking-wide">Del Vertex</span>
            </button>

            <div class="w-px h-8 bg-gray-200"></div>

            <div class="flex flex-col space-y-1">
                <button onclick="map.zoomIn()"
                    class="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full text-gray-700 transition-colors"
                    title="Zoom In">
                    <i class="fa-solid fa-plus text-xs"></i>
                </button>
                <button onclick="map.zoomOut()"
                    class="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full text-gray-700 transition-colors"
                    title="Zoom Out">
                    <i class="fa-solid fa-minus text-xs"></i>
                </button>
            </div>

            <div class="w-px h-8 bg-gray-200"></div>

            <button onclick="savePlatform()"
                class="flex flex-col items-center justify-center space-y-1 w-16 group">
                <div
                    class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center text-green-600 ring-2 ring-green-600 ring-offset-2 hover:bg-green-100 transition-colors">
                    <i class="fa-solid fa-check"></i>
                </div>
                <span class="text-[10px] font-semibold text-gray-600 uppercase tracking-wide">Save</span>
            </button>
        </div>
    </div> <!-- End Map Container -->

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="w-72 bg-white border-l border-gray-200 shadow-sm flex-shrink-0 flex flex-col z-[1500] transition-all overflow-hidden border-t-0">
        <div class="p-4 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
            <h2 id="sidebar-title" class="font-bold text-gray-900 flex items-center text-sm">
                <i class="fa-solid fa-list-ul text-purple-600 mr-2"></i> All Platforms
            </h2>
        </div>
        <div id="sidebar-content" class="flex-grow overflow-y-auto p-4 space-y-3 bg-white">
            <!-- Dynamically injected sidebar content -->
        </div>
    </div>

    </div> <!-- End Layout Wrapper Container -->


    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Load main script for Data Management (Storage object) -->
    <script src="script/main.js"></script>

    <!-- Platform specific logic script -->
    <script>
        // --- Global State ---
        let currentStationId = null;
        let pVertexMarkers = [];
        let pMidpointMarkers = [];
        let pSelectedVertexIndex = -1;
        let platformsData = []; // To keep track of all platforms for this station
        let selectedPlatformId = null; // The ID of the currently selected/editable platform
        let editedPlatformLayer = null; // The leaflet layer of the currently editing polygon
        let platformsFeatureGroup = null; // Group holding all static platforms

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentStationId = urlParams.get('id');

            if (!currentStationId) {
                alert("No station ID provided!");
                window.location.href = 'index.html';
                return;
            }

            // Retrieve station data
            const station = Storage.getStationById(currentStationId);
            if (!station) {
                alert("Station not found!");
                window.location.href = 'index.html';
                return;
            }

            // Keyboard shortcuts 
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const card = document.getElementById('platform-details-card');
                    if (card && !card.classList.contains('hidden')) {
                        togglePlatformDetailsModal(false);
                    } else if (editedPlatformLayer || selectedPlatformId) {
                        cancelEditingPlatform();
                    }
                }
            });

            // Update Header Name and Code
            document.getElementById('header-station-name').innerText = station.name;
            document.getElementById('header-station-code').innerText = station.code;
            
            const manageServicesLink = document.getElementById('manage-services-link');
            if (manageServicesLink) {
                manageServicesLink.href = 'services.html?id=' + currentStationId;
            }

            // Initialize Map
            // Hide zoom controls natively, we can add custom later if needed
            map = L.map('map', { zoomControl: false, maxZoom: 24 }).setView([station.lat, station.lng], station.zoom || 14);

            // Add standard Base Layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 24,
                maxNativeZoom: 19,
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            // Add OpenRailwayMap Overlay layer
            L.tileLayer('https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
                maxZoom: 24,
                maxNativeZoom: 19,
                attribution: 'Map data: &copy; OpenStreetMap | Map style: &copy; OpenRailwayMap'
            }).addTo(map);

            // Render existing station area as a disabled/non-editable feature
            if (station.geojson) {
                const stationFeatureGroup = new L.FeatureGroup();
                map.addLayer(stationFeatureGroup);
                
                // Parse GEOJSON
                const geoJsonLayer = L.geoJSON(station.geojson);
                
                // Add layers from parsed GeoJSON and style them
                geoJsonLayer.eachLayer(layer => {
                    layer.setStyle({ 
                        color: '#2563EB', // Primary blue
                        fillOpacity: 0.1, // Lighter opacity to reflect that it's uneditable
                        weight: 2,
                        dashArray: '5, 5' // Make border dashed to show it's a boundary context, not an active drawing
                    });
                    
                    // Add purely visual layer, disable interactivity if needed
                    layer.options.interactive = false; 
                    
                    stationFeatureGroup.addLayer(layer);
                });
                
                // Fit bounds to station if no platforms
                map.fitBounds(stationFeatureGroup.getBounds());
            }

            // Render existing platforms permanently stored in Storage
            platformsData = Storage.getPlatformsByStationId(currentStationId);
            platformsFeatureGroup = new L.FeatureGroup();
            map.addLayer(platformsFeatureGroup);

            if (platformsData && platformsData.length > 0) {
                renderAllStaticPlatforms();
                
                // If platforms exist, fit bounds to them instead of just the station
                map.fitBounds(platformsFeatureGroup.getBounds());
            }

            renderSidebar();
        });

        function renderAllStaticPlatforms() {
            platformsFeatureGroup.clearLayers();
            
            platformsData.forEach(p => {
                if (p.id === selectedPlatformId) return; // Don't render static if it's currently selected

                if (p.geojson) {
                    const layer = L.geoJSON(p.geojson, {
                        style: {
                            color: '#6B7280', // Gray-500 for unselected
                            weight: 2,
                            fillOpacity: 0.4
                        }
                    }).bindTooltip(p.name, {
                        permanent: true, 
                        direction: 'center',
                        className: 'font-bold text-gray-700 bg-white/80 border-none shadow-sm rounded px-1 py-0.5 text-xs'
                    });

                    // Add click event to select this platform
                    layer.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        selectPlatform(p.id);
                    });

                    // Add hover effects
                    layer.on('mouseover', function (e) {
                        this.setStyle({
                            fillOpacity: 0.6,
                            color: '#8B5CF6' // Purple-500
                        });
                        this.bringToFront();
                    });
                    
                    layer.on('mouseout', function (e) {
                        this.setStyle({
                            fillOpacity: 0.4,
                            color: '#6B7280' // Gray-500
                        });
                    });
                    platformsFeatureGroup.addLayer(layer);
                }
            });
        }

        function renderSidebar() {
            const sidebarTitle = document.getElementById('sidebar-title');
            const sidebarContent = document.getElementById('sidebar-content');

            if (selectedPlatformId || editedPlatformLayer) {
                // Detailed View
                sidebarTitle.innerHTML = `<i class="fa-solid fa-vector-square text-purple-600 mr-2"></i> Platform Details`;
                
                const platform = platformsData.find(p => p.id === selectedPlatformId);
                const name = platform ? platform.name : "New Platform (Unsaved)";

                sidebarContent.innerHTML = `
                    <div class="bg-purple-50 rounded-xl p-4 border border-purple-100">
                        <div class="text-xs font-semibold text-purple-400 uppercase tracking-wider mb-1">Editing Platform</div>
                        <h3 class="text-lg font-bold text-purple-900 truncate">${name}</h3>
                    </div>
                    
                    <div class="text-xs text-gray-500 mt-4 leading-relaxed px-1">
                        <p class="mb-2"><i class="fa-solid fa-info-circle mr-1 text-gray-400"></i> Shape is currently editable on the map.</p>
                        <p><i class="fa-solid fa-lightbulb mr-1 text-yellow-500"></i> Dbl-click vertices inside the platform or services to delete them. Click midpoints to add.</p>
                    </div>

                    <div class="mt-4 space-y-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Quick Actions</p>
                        <button onclick="savePlatform()" class="w-full text-left px-3 py-2 bg-white hover:bg-green-50 hover:text-green-700 hover:border-green-200 text-gray-700 font-medium text-sm rounded-lg transition-colors border border-gray-200 shadow-sm">
                            <i class="fa-solid fa-check mr-2 text-green-500"></i> Open Save Details
                        </button>
                        <button onclick="${selectedPlatformId ? 'deleteCurrentPlatform()' : 'cancelEditingPlatform()'}" class="w-full text-left px-3 py-2 bg-white hover:bg-red-50 hover:text-red-600 hover:border-red-200 text-red-500 font-medium text-sm rounded-lg transition-colors border border-gray-200 shadow-sm">
                            <i class="fa-solid fa-trash-can mr-2"></i> ${selectedPlatformId ? 'Delete Platform' : 'Discard Drawing'}
                        </button>
                        <button onclick="cancelEditingPlatform()" class="w-full text-left px-3 py-2 bg-white hover:bg-gray-100 text-gray-600 hover:text-gray-900 border border-gray-200 font-medium text-sm rounded-lg transition-colors shadow-sm">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Stop Editing
                        </button>
                    </div>
                `;
            } else {
                // List View
                sidebarTitle.innerHTML = `<i class="fa-solid fa-list-ul text-purple-600 mr-2"></i> All Platforms`;
                
                if (platformsData.length === 0) {
                    sidebarContent.innerHTML = `
                        <div class="text-center py-10 px-4">
                            <div class="w-12 h-12 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-3">
                                <i class="fa-solid fa-vector-square text-xl"></i>
                            </div>
                            <p class="text-sm text-gray-500 font-medium">No platforms yet</p>
                            <p class="text-xs text-gray-400 mt-1">Click 'Add Poly' to create one</p>
                        </div>
                    `;
                } else {
                    let html = '';
                    platformsData.forEach(p => {
                        html += `
                            <div onclick="selectPlatform('${p.id}')" class="group bg-white border border-gray-200 hover:border-purple-300 rounded-xl p-3 cursor-pointer transition-all shadow-sm hover:shadow-md flex items-center justify-between">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <div class="w-8 h-8 rounded bg-purple-50 flex items-center justify-center text-purple-600 group-hover:scale-110 group-hover:bg-purple-100 transition-all flex-shrink-0">
                                        <i class="fa-solid fa-train"></i>
                                    </div>
                                    <div class="truncate">
                                        <p class="font-bold text-sm text-gray-800 group-hover:text-purple-700 transition-colors truncate">${p.name}</p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-chevron-right text-gray-300 group-hover:text-purple-400 text-xs transition-colors"></i>
                            </div>
                        `;
                    });
                    sidebarContent.innerHTML = html;
                }
            }
        }

        // --- Platform Drawing / Selection Logic ---
        function selectPlatform(platformId) {
            // If we are already editing one, maybe ask to save/discard first?
            if (editedPlatformLayer) {
                if(!confirm("You have unsaved changes on the current platform. Discard and select another?")) {
                    return;
                }
                clearPlatformEditingState();
            }

            selectedPlatformId = platformId;
            const platform = platformsData.find(p => p.id === platformId);
            if (!platform) return;

            // Remove it from static group and re-render static
            renderAllStaticPlatforms();

            // Extracting the polygon data
            const staticLayer = L.geoJSON(platform.geojson);
            const latlngs = staticLayer.getLayers()[0].getLatLngs();

            startEditingPlatformPolygon(latlngs);
            // Pre-fill the input name
            document.getElementById('platform-name-input').value = platform.name;
        }

        function clearPlatformEditingState() {
            if (editedPlatformLayer) {
                map.removeLayer(editedPlatformLayer);
                editedPlatformLayer = null;
            }
            clearPlatformMarkers();
            selectedPlatformId = null;
            document.getElementById('platform-name-input').value = ""; // clear input
            renderAllStaticPlatforms();
            updatePlatformButtons();
            renderSidebar();
        }

        function cancelEditingPlatform() {
            togglePlatformDetailsModal(false);
            clearPlatformEditingState();
        }

        function startEditingPlatformPolygon(latlngs) {
            editedPlatformLayer = L.polygon(latlngs, {
                color: 'purple',
                weight: 3,
                fillOpacity: 0.4
            }).addTo(map);

            renderPlatformVertices();
            updatePlatformButtons();
            renderSidebar();
        }

        function addPlatformPolygon() {
            if (editedPlatformLayer) {
                if (confirm(selectedPlatformId ? "Cancel editing this platform?" : "Clear this new platform shape?")) {
                    clearPlatformEditingState();
                }
                return;
            }
            
            // Create initial shape in center of view
            selectedPlatformId = null; // Creating a new one
            const center = map.getCenter();
            // Made the initial shape smaller to fit platforms better
            const rLat = 0.00005; 
            const rLng = 0.0002; 
            const p1 = [center.lat + rLat, center.lng - rLng];
            const p2 = [center.lat - rLat, center.lng - rLng];
            const p3 = [center.lat - rLat, center.lng + rLng];
            const p4 = [center.lat + rLat, center.lng + rLng];
            const latlngs = [p1, p2, p3, p4];

            startEditingPlatformPolygon([latlngs]);
        }

        function updatePlatformButtons() {
            const actionBtn = document.getElementById('btn-add-polygon');
            if (!actionBtn) return;
            const iconContainer = actionBtn.querySelector('div');
            const icon = actionBtn.querySelector('i');
            const label = actionBtn.querySelector('span');

            if (editedPlatformLayer) {
                label.innerText = "Cancel";
                icon.className = "fa-solid fa-rotate-left";
                iconContainer.className = "w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-colors text-gray-700";
            } else {
                label.innerText = "Add Poly";
                icon.className = "fa-solid fa-draw-polygon";
                iconContainer.className = "w-10 h-10 bg-purple-50 rounded-full flex items-center justify-center group-hover:bg-purple-500 group-hover:text-white transition-colors text-purple-600";
            }
        }

        function clearPlatformMarkers() {
            pVertexMarkers.forEach(m => map.removeLayer(m));
            pMidpointMarkers.forEach(m => map.removeLayer(m));
            pVertexMarkers = [];
            pMidpointMarkers = [];
            pSelectedVertexIndex = -1;
            const deleteBtn = document.getElementById('btn-delete-vertex');
            if(deleteBtn) {
                deleteBtn.disabled = true;
                deleteBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function renderPlatformVertices() {
            clearPlatformMarkers();
            if (!editedPlatformLayer) return;

            const latlngs = editedPlatformLayer.getLatLngs()[0]; // Outer ring

            // 1. Create Handle Markers (Vertices)
            latlngs.forEach((latlng, index) => {
                const marker = L.marker(latlng, {
                    draggable: true,
                    icon: L.divIcon({
                        className: 'vertex-marker',
                        html: `<div class="w-2.5 h-2.5 bg-white border border-purple-600 rounded-full shadow-sm hover:scale-150 transition-transform cursor-pointer"></div>`,
                        iconSize: [10, 10],
                        iconAnchor: [5, 5]
                    })
                }).addTo(map);

                marker.on('drag', (e) => {
                    const newPos = e.target.getLatLng();
                    latlngs[index] = newPos;
                    editedPlatformLayer.setLatLngs([latlngs]);
                    updatePlatformMidpoints();
                });

                marker.on('dragend', () => {
                    renderPlatformVertices();
                });

                marker.on('dblclick', (e) => {
                    L.DomEvent.stopPropagation(e);
                    selectPlatformVertex(index);
                });

                pVertexMarkers.push(marker);
            });

            // 2. Create Edge Splitters (Midpoints)
            latlngs.forEach((latlng, index) => {
                const nextIndex = (index + 1) % latlngs.length;
                const nextLatlng = latlngs[nextIndex];

                const midLat = (latlng.lat + nextLatlng.lat) / 2;
                const midLng = (latlng.lng + nextLatlng.lng) / 2;

                const midMarker = L.marker([midLat, midLng], {
                    draggable: false,
                    icon: L.divIcon({
                        className: 'midpoint-marker',
                        html: `<div class="w-2 h-2 bg-white/80 border border-purple-400 rounded-full shadow-sm hover:bg-purple-100 cursor-pointer transition-all transform hover:scale-150" title="Add Vertex"></div>`,
                        iconSize: [8, 8],
                        iconAnchor: [4, 4]
                    })
                }).addTo(map);

                midMarker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    addPlatformVertex(index);
                });

                pMidpointMarkers.push(midMarker);
            });
        }

        function updatePlatformMidpoints() {
            if (!editedPlatformLayer) return;
            const latlngs = editedPlatformLayer.getLatLngs()[0];

            pMidpointMarkers.forEach((marker, index) => {
                const nextIndex = (index + 1) % latlngs.length;
                const p1 = latlngs[index];
                const p2 = latlngs[nextIndex];
                marker.setLatLng([(p1.lat + p2.lat) / 2, (p1.lng + p2.lng) / 2]);
            });
        }

        function addPlatformVertex(afterIndex) {
            const latlngs = editedPlatformLayer.getLatLngs()[0];
            const p1 = latlngs[afterIndex];
            const p2 = latlngs[(afterIndex + 1) % latlngs.length];

            const newPoint = L.latLng((p1.lat + p2.lat) / 2, (p1.lng + p2.lng) / 2);

            latlngs.splice(afterIndex + 1, 0, newPoint);
            editedPlatformLayer.setLatLngs([latlngs]);

            renderPlatformVertices();
        }

        function selectPlatformVertex(index) {
            pSelectedVertexIndex = index;

            pVertexMarkers.forEach((m, i) => {
                const el = m.getElement().querySelector('div');
                if (i === index) {
                    el.classList.remove('bg-white', 'border-purple-600');
                    el.classList.add('bg-red-500', 'border-red-600');
                } else {
                    el.classList.add('bg-white', 'border-purple-600');
                    el.classList.remove('bg-red-500', 'border-red-600');
                }
            });

            const btn = document.getElementById('btn-delete-vertex');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function deletePlatformSelectedVertex() {
            if (pSelectedVertexIndex === -1 || !editedPlatformLayer) return;

            const latlngs = editedPlatformLayer.getLatLngs()[0];

            if (latlngs.length <= 3) {
                showToast("A polygon must have at least 3 vertices.", true);
                return;
            }

            latlngs.splice(pSelectedVertexIndex, 1);
            editedPlatformLayer.setLatLngs([latlngs]);

            pSelectedVertexIndex = -1;
            const btn = document.getElementById('btn-delete-vertex');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            renderPlatformVertices();
        }

        function togglePlatformDetailsModal(show) {
            const card = document.getElementById('platform-details-card');
            const backdrop = document.getElementById('platform-details-card-backdrop');

            if (show === false || !card.classList.contains('hidden')) {
                // Close
                card.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    card.classList.add('hidden');
                    backdrop.classList.add('hidden');
                }, 300);
            } else {
                // Open
                card.classList.remove('hidden');
                backdrop.classList.remove('hidden');
                setTimeout(() => {
                    card.classList.remove('scale-95', 'opacity-0');
                    card.classList.add('scale-100', 'opacity-100');
                    backdrop.classList.remove('opacity-0');
                }, 10);
            }
        }

        function savePlatform() {
            if (!editedPlatformLayer) {
                showToast("Please draw or select a platform shape first.", true);
                return;
            }
            
            // Provide default name if new
            if(!selectedPlatformId) {
                const input = document.getElementById('platform-name-input');
                if(!input.value) {
                    input.value = "Platform " + (platformsData.length + 1);
                }
            }

            togglePlatformDetailsModal(true);
        }

        function confirmSavePlatform() {
            const name = document.getElementById('platform-name-input').value.trim();
            if (!name) {
                showToast("Platform name is required.", true);
                return; 
            }

            const platformData = {
                id: selectedPlatformId || Date.now().toString(), // Update existing or create new
                stationId: currentStationId,
                name: name,
                geojson: editedPlatformLayer.toGeoJSON()
                // Services will be managed entirely in services.html moving forward,
                // but we should probably keep existing services intact if we overwrite the geometry here.
                // To do this safely, we preserve any existing services property.
            };

            const existingPlatform = platformsData.find(p => p.id === platformData.id);
            if(existingPlatform && existingPlatform.services) {
                platformData.services = existingPlatform.services;
            }

            if (selectedPlatformId) {
                // Update Existing Platform
                const index = platformsData.findIndex(p => p.id === selectedPlatformId);
                if(index !== -1) {
                    platformsData[index] = platformData;
                    Storage.savePlatforms(platformsData);
                }
                showToast("Platform '" + name + "' updated successfully!");
            } else {
                // Create New Platform
                Storage.addPlatform(platformData);
                platformsData.push(platformData);
                showToast("Platform '" + name + "' saved successfully!");
            }
            
            togglePlatformDetailsModal(false);
            clearPlatformEditingState(); // Deselect it, make it gray
        }

        function deleteCurrentPlatform() {
            if(!selectedPlatformId) return;

            if (confirm("Are you sure you want to delete this platform?")) {
                const index = platformsData.findIndex(p => p.id === selectedPlatformId);
                if(index !== -1) {
                    platformsData.splice(index, 1);
                    Storage.savePlatforms(platformsData);
                    showToast("Platform deleted successfully!");
                    togglePlatformDetailsModal(false);
                    clearPlatformEditingState();
                }
            }
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-5 right-5 ${isError ? 'bg-red-600' : 'bg-green-600'} text-white px-6 py-3 rounded-lg shadow-lg z-[4000] flex items-center transition-all duration-300 transform translate-y-10 opacity-0 font-medium text-sm`;
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation' : 'fa-check'} mr-2"></i> ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 50);
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
